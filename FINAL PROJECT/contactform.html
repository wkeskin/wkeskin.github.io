<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Form | HODE.CO REALESTATE</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="realestate.css">
    <style>
        h3{background-image: linear-gradient(to right, rgb(161, 212, 236) , rgb(136, 235, 225)); padding: 1px;}
        main{margin-left: 20px; margin-right: 20px;}
    </style>
<body>
    <div id = wrapper>
        <header>
            <div class = "logo">
                <a href="homepage.html" >
                    <img src = "logo-transparent.png" alt= "Logo" width="30%" height="30%"></a>  
            </div>
            <div class="lword"><h1>Real Deal . Real Dream</h1></div> 
        </header>
        <nav class ="menu">
            <b>
            <a href="homepage.html">Home</a> |
            <a href="listings.html">Property Listings</a> |
            <a href ="contactform.html">Contact Form</a> |
            <a href ="sitemap.html">Site Map and Credits</a> |
            </b>
        </nav>
        <main>
            <div id = "img1">
                <img src="https://www.chamberspestsolutions.com.au/wp-content/uploads/2015/05/home-banner-2.jpg" width="50%">
            </div><br><br>
            <h4>Contact Us Today!</h4>
            <p>Required fields are marked with an asterisk *</p>
            <form action="mailto:wkeskin@my.centennialcollege.ca" method="post" enctype="text/plain" name="EmailForm">
            <label for="myFName"> *First Name: </label>
            <input type="text" id="myFName" name="myFName" value="">
            <label for="myLName"> *Last Name: </label>
            <input type="text" id="myLName" name="myLName" value="">
            <label for="myEmail"> *E-mail Address: </label>
            <input type="email" id="myEmail" name="myEmail" placeholder="contact@yourdomain.com" value="" size="35">
            <label for="myphone"> Phone Number: </label>
            <input type="tel" id="myphone" name="myphone" placeholder="222-222-2222" value="" maxlength="12">
            <label for="typeofProperty"> Type of property: </label>
            <select>
            <option value="house">House</option>
            <option value="condo">Condominium</option>
            </select><br><br>
            <label for="bedrooms">Number of Bedrooms: </label>
            <input type="number" id="bedrooms" name="bedrooms" value="" min="1" max="14">
            <label for="bathrooms">Number of Bathrooms: </label>
            <input type="number" id="bathrooms" name="bathrooms" value="" min="1" max="14">
            <label for="price"> Price Range: </label>
            <select>
            <option value="1500-2000">$1,000 - $2,000</option>
            <option value="2000-3000">$2,000 - $3,000</option>
            <option value="3000-4000">$3,000 - $4,000</option>
            <option value="4000-5000">$4,000 - $5,000</option>
            <option value="5000-6000">$5,000 - $6,000</option>
            <option value="under500000">UNDER $500,000 sale price</option>
            <option value="above500000">ABOVE $500,000 sale price</option>
            </select><br><br>
            <label for="myComments"> *Comments: </label>
            <textarea id="myComments" name="myComments" rows="2" cols="30"></textarea>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
            </form>
        </main>
        <footer>
            <p style="color:rgb(253, 253, 255)">
                <small><i>Copyright &copy; Wardatul Keskin, 301294696, COMP 213 - Web Interface Design, Fall 2022</i></small>
            </p>
        </footer>
    </div>
</body>
